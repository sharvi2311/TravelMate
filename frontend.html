<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelMate | Plan your next journey</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        .icon-box { width: 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .dropdown-menu { display: none; position: absolute; top: 100%; right: 0; background: white; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); min-width: 200px; z-index: 50; }
        .dropdown:hover .dropdown-menu { display: block; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const API = "http://localhost:8000/api";

        const safeFetch = async (url, fallback) => {
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                return await res.json();
            } catch (error) {
                console.warn(`Fetch failed for ${url}, using fallback.`, error);
                return fallback;
            }
        };

        const MOCK_SPOTS = [{"id":"s1","name":"Tiger's Leap","geography":"High altitude cliff","history":"Named for its resemblance to a tiger jumping","aesthetic":"Stunning panoramic views","sentiment_score":0.85,"crowd_level":"High","entry_fee":20},{"id":"s2","name":"Bhushi Dam","geography":"Water reservoir","history":"Built in 1907","aesthetic":"Water overflowing over steps","sentiment_score":0.70,"crowd_level":"High","entry_fee":0},{"id":"s3","name":"Karla Caves","geography":"Basalt rock hills","history":"Ancient Buddhist rock-cut caves","aesthetic":"Intricate carvings","sentiment_score":0.90,"crowd_level":"Low","entry_fee":250}];
        const MOCK_DRIVERS = [{"id":"d1","name":"Ramesh Patil","vehicle_type":"Sedan (Dzire)","capacity":4,"experience_years":8,"languages":["Marathi","Hindi","English"],"background_verified":true,"communication_rating":4.8,"base_rate_per_km":12.0},{"id":"d2","name":"Suresh Jadhav","vehicle_type":"Innova Crysta","capacity":6,"experience_years":12,"languages":["Marathi","Hindi"],"background_verified":true,"communication_rating":4.5,"base_rate_per_km":16.0}];
        const MOCK_RESTAURANTS = [{"id":"r1","name":"Chhaya Restaurant","cuisine":"Indian, Chinese","avg_cost":400,"distance_from_route":0.5,"hours":"8:00 AM - 11:00 PM"},{"id":"r2","name":"Maharashtra Dhaba","cuisine":"Maharashtrian","avg_cost":250,"distance_from_route":0.2,"hours":"6:00 AM - 11:00 PM"}];
        
        // FIX: ENSURING ALL 9 PACKAGES ARE HERE
        const MOCK_PACKAGES = [
            {"id":"p1","title":"Lonavala Express Day Trip","provider":"MSRTC Shivneri","price":850,"inclusions":["AC Bus","Tiger's Leap","Bhushi Dam"],"rating":4.2,"duration":"One day","preference":"Nature","from":"Pune","to":"Lonavala"},
            {"id":"p5","title":"Weekend Nature Escape","provider":"Green Trails","price":3500,"inclusions":["SUV","Trekking","Camping","Bonfire"],"rating":4.5,"duration":"Weekend","preference":"Nature","from":"Pune","to":"Lonavala"},
            {"id":"p6","title":"Extended Hills Adventure","provider":"Sahyadri Explorers","price":5500,"inclusions":["Private Cab","Trekking","Camping","All Meals"],"rating":4.6,"duration":"2-3 days","preference":"Nature","from":"Pune","to":"Lonavala"},
            {"id":"p2","title":"Premium Caves & Valleys Tour","provider":"Deccan Odyssey Travels","price":2500,"inclusions":["Innova Cab","Karla Caves","Lunch","Guide"],"rating":4.7,"duration":"Weekend","preference":"Culture","from":"Pune","to":"Lonavala"},
            {"id":"p7","title":"Heritage Caves Day Tour","provider":"Heritage Walks","price":1800,"inclusions":["AC Bus","Karla & Bhaja Caves","Guide","Lunch"],"rating":4.3,"duration":"One day","preference":"Culture","from":"Pune","to":"Lonavala"},
            {"id":"p3","title":"Budget Backpacker Special","provider":"Youth Hostels India","price":600,"inclusions":["Shared Cab","Bhushi Dam","Street Food Tour"],"rating":4.0,"duration":"One day","preference":"Food","from":"Pune","to":"Lonavala"},
            {"id":"p8","title":"Culinary Weekend Retreat","provider":"Foodie Trails","price":4200,"inclusions":["Private Cab","Farm Visit","Cooking Class","All Meals"],"rating":4.8,"duration":"Weekend","preference":"Food","from":"Pune","to":"Lonavala"},
            {"id":"p4","title":"Luxury Hills Retreat","provider":"Taj Safaris","price":8500,"inclusions":["Private SUV","5-Star Stay","Spa","Fine Dining"],"rating":4.9,"duration":"2-3 days","preference":"Relaxation","from":"Mumbai","to":"Lonavala"},
            {"id":"p9","title":"Spa & Wellness Day","provider":"Serenity Escapes","price":3200,"inclusions":["Cab","Resort Day Pass","Spa","Lunch"],"rating":4.4,"duration":"One day","preference":"Relaxation","from":"Pune","to":"Lonavala"},
            {"id":"p10","title":"Mumbai Darshan Bus Ticket","provider":"Mumbai Darshan Tours","price":499,"inclusions":["12-hour guided tour","Multilingual live guide","Free cancellation","Pickup & drop"],"rating":4.6,"duration":"One day","preference":"Culture","from":"Mumbai","to":"Mumbai (City Tour)","itinerary":[{"name":"The Asiatic Society Mumbai","halt":"10 min"},{"name":"Gateway of India","halt":"45 min"},{"name":"Sailing Boat Ride","halt":"30 min"},{"name":"Chhatrapati Shivaji Maharaj Vastu Sangrahalay (CSMVS)","halt":"50 min"},{"name":"Jehangir Art Gallery","halt":"15 min"},{"name":"Paradox Museum (Optional)","halt":"1 hr"},{"name":"Marine Drive (Queen's Necklace)","halt":"10 min"},{"name":"Mahalaxmi Temple","halt":"35 min"},{"name":"Nehru Science Centre + Orama 4D Show","halt":"50 min"},{"name":"Siddhivinayak Temple","halt":"35 min"},{"name":"National Museum of Indian Cinema","halt":"45 min"},{"name":"Juhu Beach","halt":"45 min"}],"boarding_points":[{"route":"From Thane","stops":"Thane, Mulund, Bhandup, Vikhroli, Ghatkopar, Chembur, CSTM"},{"route":"From Panvel","stops":"Panvel, Khanda Colony, Kalamboli, Kamothe, Kharghar, Belapur, Seawood, Nerul, Jui Nagar, Sanpada, Vashi, Chembur"},{"route":"From Borivali","stops":"Dahisar, Borivali, Kandivali, Malad, Goregaon, Jogeshwari, Andheri East, Chakala, Ville Parle, Santacruz, Bandra, Mahim, Dadar, Byculla"}]}
        ];

        const CrowdIndicator = ({ level }) => {
            const colors = { Low: 'bg-green-500', Medium: 'bg-yellow-500', High: 'bg-red-500' };
            return <span className={`inline-block w-3 h-3 rounded-full ${colors[level]} mr-2`}></span>;
        };

        const AuthBadge = ({ score }) => {
            if (score >= 0.8) return <span className="text-xs bg-green-100 text-green-800 px-2 py-1 rounded-full font-medium">✓ Verified Authentic</span>;
            if (score >= 0.6) return <span className="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded-full font-medium">Likely Genuine</span>;
            return <span className="text-xs bg-red-100 text-red-800 px-2 py-1 rounded-full font-medium">⚠ Suspicious</span>;
        };

        function App() {
            const [view, setView] = useState('landing'); // 'landing', 'packages', 'wizard'
            const [modal, setModal] = useState(null);
            const [step, setStep] = useState(1);
            const [formData, setFormData] = useState({ start_loc: 'Pune', dest: 'Lonavala', style: 'Nature & adventure', transport: 'Car / taxi', budget: 2000, duration: 'One day', travellers: 2 });
            
            const [spots, setSpots] = useState([]);
            const [drivers, setDrivers] = useState([]);
            const [restaurants, setRestaurants] = useState([]);
            const [packages, setPackages] = useState([]);
            const [packagesLoading, setPackagesLoading] = useState(false);
            
            const [selectedSpots, setSelectedSpots] = useState([]);
            const [selectedDriver, setSelectedDriver] = useState(null);
            const [itinerary, setItinerary] = useState(null);
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                setPackagesLoading(true);
                Promise.all([
                    safeFetch(`${API}/spots`, MOCK_SPOTS),
                    safeFetch(`${API}/drivers`, MOCK_DRIVERS),
                    safeFetch(`${API}/restaurants`, MOCK_RESTAURANTS),
                    safeFetch(`${API}/packages`, MOCK_PACKAGES)
                ]).then(([s, d, r, p]) => {
                    setSpots(s); setDrivers(d); setRestaurants(r); setPackages(p);
                    setPackagesLoading(false);
                });
            }, []);

            const startWizard = () => { setView('wizard'); setStep(1); };

            const calculateTrip = async () => {
                if (!selectedDriver) return alert("Please select a driver");
                setLoading(true);
                const payload = { spot_ids: selectedSpots, transport_mode: formData.transport.toLowerCase().includes('car') ? 'car' : 'bus', traveller_count: formData.travellers, driver_id: selectedDriver.id };

                try {
                    const res = await fetch(`${API}/itinerary/calculate`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
                    if (!res.ok) throw new Error("Backend error");
                    const data = await res.json();
                    setItinerary(data);
                } catch (e) {
                    const base_distance = 130 + (selectedSpots.length * 5);
                    const transport_cost = base_distance * selectedDriver.base_rate_per_km;
                    const entry_fees = spots.filter(s => selectedSpots.includes(s.id)).reduce((acc, s) => acc + s.entry_fee, 0) * formData.travellers;
                    setItinerary({ route_plan: ["Pune (Start)", ...spots.filter(s=>selectedSpots.includes(s.id)).map(s=>s.name), "Lonavala Market", "Pune (Drop)"], breakdown: { transport_cost, entry_fees, service_charge: 500 }, total_price: transport_cost + entry_fees + 500, driver_details: selectedDriver });
                }
                setLoading(false);
                setStep(4);
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-white shadow-sm z-20 relative">
                        <div className="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
                            <div className="flex items-center space-x-2 cursor-pointer" onClick={() => setView('landing')}>
                                <span className="text-2xl">↗</span><h1 className="text-xl font-bold text-indigo-700">TravelMate</h1>
                            </div>
                            <nav className="space-x-6 text-gray-600 font-medium flex items-center">
                                <div className="dropdown relative">
                                    <button className="hover:text-indigo-600 flex items-center">Explore <svg className="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg></button>
                                    <div className="dropdown-menu mt-2 py-2">
                                        <a href="#" className="block px-4 py-2 hover:bg-gray-100">🗺️ Popular Destinations</a>
                                        <a href="#" className="block px-4 py-2 hover:bg-gray-100">💡 Travel Tips & Guides</a>
                                        <a href="#" className="block px-4 py-2 hover:bg-gray-100">🔥 Special Offers</a>
                                    </div>
                                </div>
                                {(view === 'wizard' || view === 'packages') && (
                                    <button onClick={() => setView('landing')} className="text-indigo-600 hover:text-indigo-800">← Back to Home</button>
                                )}
                            </nav>
                        </div>
                    </header>

                    <main className="flex-grow">
                        {view === 'landing' && <LandingView setView={setView} startWizard={startWizard} />}
                        {view === 'packages' && <PackagesPage packages={packages} packagesLoading={packagesLoading} startWizard={startWizard} />}
                        {view === 'wizard' && <WizardView step={step} setStep={setStep} formData={formData} setFormData={setFormData} spots={spots} drivers={drivers} restaurants={restaurants} selectedSpots={selectedSpots} setSelectedSpots={setSelectedSpots} selectedDriver={selectedDriver} setSelectedDriver={setSelectedDriver} itinerary={itinerary} calculateTrip={calculateTrip} loading={loading} start_loc={formData.start_loc} dest={formData.dest} />}
                    </main>

                    {modal === 'ai' && <AIModal close={() => setModal(null)} />}

                    <footer className="bg-white border-t mt-auto"><div className="max-w-6xl mx-auto px-4 py-6 text-center text-gray-500 text-sm">TravelMate · Travel more, spend wisely.</div></footer>
                </div>
            );
        }

        function LandingView({ setView, startWizard }) {
            return (
                <div className="max-w-6xl mx-auto px-4 py-12 fade-in">
                    <div className="text-center mb-12">
                        <h2 className="text-4xl font-bold text-gray-900 mb-3">How would you like to travel?</h2>
                        <p className="text-lg text-gray-600">Choose your way to plan. We'll help you make the most of every journey.</p>
                    </div>
                    <div className="grid md:grid-cols-3 gap-8">
                        {/* FIX: Changed onClick to setView('packages') */}
                        <div className="bg-white p-8 rounded-xl shadow-sm border border-gray-100 hover:shadow-lg hover:-translate-y-1 transition-all duration-300 cursor-pointer group" onClick={() => setView('packages')}>
                            <div className="icon-box bg-gradient-to-br from-blue-400 to-blue-600 text-white mb-5 group-hover:scale-110 transition-transform">🧳</div>
                            <h3 className="text-xl font-bold mb-2">See Packages</h3>
                            <p className="text-gray-600 mb-4">Explore affordable trips and compare ready-made packages from travel agencies.</p>
                            <span className="text-indigo-600 font-semibold group-hover:underline">Explore packages →</span>
                        </div>
                        <div className="bg-white p-8 rounded-xl shadow-sm border border-gray-100 hover:shadow-lg hover:-translate-y-1 transition-all duration-300 cursor-pointer group" onClick={() => setModal('ai')}>
                            <div className="icon-box bg-gradient-to-br from-purple-400 to-purple-600 text-white mb-5 group-hover:scale-110 transition-transform">🤖</div>
                            <h3 className="text-xl font-bold mb-2">AI Travel Assistant</h3>
                            <p className="text-gray-600 mb-4">Tell us your destination, budget and interests. Get trip suggestions that fit you.</p>
                            <span className="text-indigo-600 font-semibold group-hover:underline">Plan with AI →</span>
                        </div>
                        <div className="bg-white p-8 rounded-xl shadow-sm border border-gray-100 hover:shadow-lg hover:-translate-y-1 transition-all duration-300 cursor-pointer group" onClick={startWizard}>
                            <div className="icon-box bg-gradient-to-br from-green-400 to-green-600 text-white mb-5 group-hover:scale-110 transition-transform">✏️</div>
                            <h3 className="text-xl font-bold mb-2">Customize Your Trip</h3>
                            <p className="text-gray-600 mb-4">Build your own adventure by choosing your destination, transport and activities.</p>
                            <span className="text-indigo-600 font-semibold group-hover:underline">Create your trip →</span>
                        </div>
                    </div>
                </div>
            );
        }

        // --- NEW: FULL PAGE PACKAGES VIEW ---
        function PackagesPage({ packages, packagesLoading, startWizard }) {
            const CITIES = ['Pune', 'Mumbai', 'Lonavala', 'Khandala', 'Mahabaleshwar', 'Nashik', 'Igatpuri', 'Mumbai (City Tour)'];
            
            const [adults, setAdults] = useState(2);
            const [kids, setKids] = useState(0);
            const [from, setFrom] = useState('Any');
            const [to, setTo] = useState('Any');
            const [budget, setBudget] = useState(10000);
            const [duration, setDuration] = useState('Any');
            const [departDate, setDepartDate] = useState('');
            const [preference, setPreference] = useState('Any');
            
            const [filteredPackages, setFilteredPackages] = useState(packages);
            const [hasSearched, setHasSearched] = useState(false);
            const [expandedPackage, setExpandedPackage] = useState(null);

            useEffect(() => { setFilteredPackages(packages); }, [packages]);

            const fromOptions = ['Any', ...CITIES.filter(city => city !== to)];
            const toOptions = ['Any', ...CITIES.filter(city => city !== from)];

            const handleSearch = () => {
                setHasSearched(true);
                const results = packages.filter(p => {
                    if (p.price > budget) return false;
                    if (from !== 'Any' && p.from && p.from.toLowerCase() !== from.toLowerCase()) return false;
                    if (to !== 'Any' && p.to && p.to.toLowerCase() !== to.toLowerCase()) return false;
                    if (duration !== 'Any' && p.duration !== duration) return false;
                    if (preference !== 'Any' && p.preference !== preference) return false;
                    return true;
                });
                setFilteredPackages(results);
            };

            const handleReset = () => {
                setFrom('Any'); setTo('Any'); setBudget(10000); setDuration('Any'); setPreference('Any');
                setFilteredPackages(packages); setHasSearched(false); setExpandedPackage(null);
            };

            return (
                <div className="max-w-6xl mx-auto px-4 py-8 fade-in">
                    <h2 className="text-3xl font-bold text-gray-900 mb-6">Explore Travel Packages</h2>
                    
                    {/* FILTERS BAR */}
                    <div className="bg-white p-6 rounded-xl shadow-sm border mb-8">
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                            <div><label className="text-sm font-medium text-gray-700">Where from?</label><select value={from} onChange={e => setFrom(e.target.value)} className="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border bg-white">{fromOptions.map(c => <option key={c}>{c}</option>)}</select></div>
                            <div><label className="text-sm font-medium text-gray-700">Where to?</label><select value={to} onChange={e => setTo(e.target.value)} className="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border bg-white">{toOptions.map(c => <option key={c}>{c}</option>)}</select></div>
                            <div><label className="text-sm font-medium text-gray-700">Duration</label><select value={duration} onChange={e => setDuration(e.target.value)} className="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border"><option>Any</option><option>One day</option><option>Weekend</option><option>2-3 days</option></select></div>
                            <div><label className="text-sm font-medium text-gray-700">Preference</label><select value={preference} onChange={e => setPreference(e.target.value)} className="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border"><option>Any</option><option>Nature</option><option>Culture</option><option>Food</option><option>Relaxation</option></select></div>
                        </div>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                            <div><label className="text-sm font-medium text-gray-700">Adults</label><input type="number" min="1" value={adults} onChange={e => setAdults(e.target.value)} className="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" /></div>
                            <div><label className="text-sm font-medium text-gray-700">Kids</label><input type="number" min="0" value={kids} onChange={e => setKids(e.target.value)} className="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" /></div>
                            <div><label className="text-sm font-medium text-gray-700">Departure Date</label><input type="date" value={departDate} onChange={e => setDepartDate(e.target.value)} className="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" /></div>
                            <div><label className="text-sm font-medium text-gray-700">Max Budget (₹)</label><input type="number" value={budget} onChange={e => setBudget(parseInt(e.target.value) || 0)} className="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" /></div>
                        </div>
                        <div className="flex space-x-2">
                            <button onClick={handleSearch} className="flex-1 bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 font-medium">🔍 Search Packages</button>
                            <button onClick={handleReset} className="px-6 bg-gray-200 text-gray-700 py-2 rounded-lg hover:bg-gray-300 font-medium">Reset</button>
                        </div>
                    </div>

                    {/* RESULTS */}
                    <div className="flex justify-between items-center mb-4">
                        <h3 className="text-xl font-semibold text-gray-800">{hasSearched ? `Found ${filteredPackages.length} package(s)` : `All Packages (${packages.length})`}</h3>
                        {packagesLoading && <span className="text-sm text-indigo-600 animate-pulse">Loading packages...</span>}
                    </div>

                    {packagesLoading ? (
                        <div className="text-center py-20 text-gray-500">Fetching packages from backend...</div>
                    ) : filteredPackages.length === 0 ? (
                        <div className="text-center py-20 bg-white rounded-xl border">
                            <div className="text-4xl mb-2">🔍</div>
                            <p className="text-gray-600 font-medium">No packages match your filters.</p>
                            <button onClick={handleReset} className="mt-4 text-indigo-600 hover:underline text-sm">Clear all filters</button>
                        </div>
                    ) : (
                        <div className="space-y-4">
                            {filteredPackages.map(p => (
                                <div key={p.id} className="bg-white border rounded-xl p-6 hover:shadow-md transition fade-in">
                                    <div className="flex justify-between items-start mb-2">
                                        <div>
                                            <h4 className="text-2xl font-bold text-gray-900">{p.title}</h4>
                                            <p className="text-gray-600 mt-1">By {p.provider} · <span className="text-indigo-600">{p.from} → {p.to}</span></p>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-yellow-500 font-bold text-lg">★ {p.rating}</div>
                                        </div>
                                    </div>
                                    
                                    <p className="text-sm text-gray-500 mt-3">Includes: {p.inclusions.join(", ")}</p>
                                    <div className="flex gap-2 mt-3">
                                        <span className="text-xs bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-medium">{p.duration}</span>
                                        <span className="text-xs bg-green-100 text-green-700 px-3 py-1 rounded-full font-medium">{p.preference}</span>
                                    </div>

                                    {/* EXPANDABLE ITINERARY */}
                                    {p.itinerary && (
                                        <div className="mt-4">
                                            <button onClick={() => setExpandedPackage(expandedPackage === p.id ? null : p.id)} className="text-sm text-indigo-600 hover:underline font-medium flex items-center">
                                                {expandedPackage === p.id ? 'Hide Itinerary & Boarding Points ▲' : 'View Itinerary & Boarding Points ▼'}
                                            </button>
                                            
                                            {expandedPackage === p.id && (
                                                <div className="mt-4 bg-orange-50 border border-orange-200 rounded-lg p-5 fade-in">
                                                    <h5 className="font-bold text-orange-800 mb-3 text-lg">🗺️ 12-Stop Itinerary</h5>
                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-6">
                                                        {p.itinerary.map((stop, idx) => (
                                                            <div key={idx} className="flex justify-between items-center bg-white p-3 rounded border border-orange-100 shadow-sm">
                                                                <span className="font-medium text-gray-800 text-sm">{idx + 1}. {stop.name}</span>
                                                                <span className="text-xs bg-orange-500 text-white px-2 py-1 rounded-full font-bold">Halt: {stop.halt}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                    
                                                    <h5 className="font-bold text-orange-800 mb-3 text-lg">🚌 Boarding Points</h5>
                                                    <div className="space-y-3">
                                                        {p.boarding_points.map((bp, idx) => (
                                                            <div key={idx} className="bg-white p-3 rounded border border-orange-100 shadow-sm">
                                                                <div className="font-semibold text-sm text-gray-800">{bp.route}</div>
                                                                <div className="text-xs text-gray-600 mt-1">via {bp.stops}</div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    <div className="mt-6 pt-4 border-t flex justify-between items-center">
                                        <div>
                                            <span className="text-3xl font-bold text-indigo-700">₹{p.price}</span>
                                            <span className="text-sm text-gray-500">/person</span>
                                        </div>
                                        <button onClick={startWizard} className="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 font-semibold transition">Customize this →</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        function AIModal({ close }) {
            const [prompt, setPrompt] = useState("");
            const [messages, setMessages] = useState([{ type: 'bot', text: "Hello! I'm your AI Travel Assistant. How can I help you plan your trip today?" }]);
            const handleSend = () => {
                if (!prompt.trim()) return;
                const newMessages = [...messages, { type: 'user', text: prompt }];
                newMessages.push({ type: 'bot', text: "🚧 The AI chatbot is currently under development and will be available soon! In the meantime, please use the 'Customize Your Trip' option." });
                setMessages(newMessages); setPrompt("");
            };
            return (
                <div className="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4" onClick={close}>
                    <div className="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 fade-in" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center mb-4"><h3 className="text-xl font-bold">Plan a trip with TravelMate AI</h3><button onClick={close} className="text-gray-400 hover:text-gray-600 text-2xl">&times;</button></div>
                        <div className="border rounded-lg p-4 h-64 overflow-y-auto bg-gray-50 mb-4 space-y-3">
                            {messages.map((msg, i) => (<div key={i} className={`flex ${msg.type === 'user' ? 'justify-end' : 'justify-start'}`}><div className={`max-w-[80%] p-3 rounded-lg text-sm ${msg.type === 'user' ? 'bg-indigo-600 text-white' : 'bg-white border border-gray-200 text-gray-700'}`}>{msg.text}</div></div>))}
                        </div>
                        <div className="flex space-x-2"><input value={prompt} onChange={e => setPrompt(e.target.value)} onKeyPress={e => e.key === 'Enter' && handleSend()} placeholder="Ask me anything..." className="flex-grow rounded-md border-gray-300 shadow-sm p-2 border" /><button onClick={handleSend} className="bg-indigo-600 text-white px-6 py-2 rounded-md hover:bg-indigo-700 font-medium">Send</button></div>
                    </div>
                </div>
            );
        }

        function WizardView(props) {
            const { step, setStep, formData, setFormData, spots, drivers, restaurants, selectedSpots, setSelectedSpots, selectedDriver, setSelectedDriver, itinerary, calculateTrip, loading, start_loc, dest } = props;
            return (
                <div className="max-w-4xl mx-auto p-4 pb-20 fade-in">
                    <div className="text-center mb-8 pt-6"><h2 className="text-2xl font-bold text-gray-800">Customize Your Trip: {start_loc} ↔ {dest}</h2><div className="flex justify-center mt-4 space-x-2">{[1,2,3,4].map(s => (<div key={s} className={`h-2 w-16 rounded transition-all ${step >= s ? 'bg-indigo-600' : 'bg-gray-300'}`}></div>))}</div></div>
                    {loading && <div className="text-center py-20 text-indigo-600 font-semibold">Calculating your perfect trip...</div>}
                    {!loading && step === 1 && <Step1_Customize formData={formData} setFormData={setFormData} next={() => setStep(2)} />}
                    {!loading && step === 2 && <Step2_Spots spots={spots} selectedSpots={selectedSpots} setSelectedSpots={setSelectedSpots} next={() => setStep(3)} prev={() => setStep(1)} />}
                    {!loading && step === 3 && <Step3_Drivers drivers={drivers} selectedDriver={selectedDriver} setSelectedDriver={setSelectedDriver} next={calculateTrip} prev={() => setStep(2)} />}
                    {!loading && step === 4 && itinerary && <Step4_Itinerary itinerary={itinerary} restaurants={restaurants} travellers={formData.travellers} driverId={selectedDriver?.id} />}
                </div>
            );
        }

        function Step1_Customize({ formData, setFormData, next }) {
            const update = (key, val) => setFormData({ ...formData, [key]: val });
            return (
                <div className="bg-white p-8 rounded-xl shadow-sm border">
                    <h3 className="text-xl font-bold mb-6">Build your own trip</h3>
                    <div className="grid md:grid-cols-2 gap-6">
                        <div><label className="block text-sm font-medium text-gray-700 mb-1">Starting location</label><select value={formData.start_loc} onChange={e => update('start_loc', e.target.value)} className="block w-full rounded-md border-gray-300 shadow-sm p-2 border"><option>Pune</option><option>Mumbai</option></select></div>
                        <div><label className="block text-sm font-medium text-gray-700 mb-1">Destination</label><select value={formData.dest} onChange={e => update('dest', e.target.value)} className="block w-full rounded-md border-gray-300 shadow-sm p-2 border"><option>Lonavala</option><option>Khandala</option></select></div>
                        <div><label className="block text-sm font-medium text-gray-700 mb-1">Travel style</label><select value={formData.style} onChange={e => update('style', e.target.value)} className="block w-full rounded-md border-gray-300 shadow-sm p-2 border"><option>Nature & adventure</option><option>Culture & history</option></select></div>
                        <div><label className="block text-sm font-medium text-gray-700 mb-1">Transport preference</label><select value={formData.transport} onChange={e => update('transport', e.target.value)} className="block w-full rounded-md border-gray-300 shadow-sm p-2 border"><option>Bus</option><option>Car / taxi</option></select></div>
                        <div><label className="block text-sm font-medium text-gray-700 mb-1">Budget per person (₹)</label><input type="number" value={formData.budget} onChange={e => update('budget', e.target.value)} className="block w-full rounded-md border-gray-300 shadow-sm p-2 border" /></div>
                        <div><label className="block text-sm font-medium text-gray-700 mb-1">Duration</label><select value={formData.duration} onChange={e => update('duration', e.target.value)} className="block w-full rounded-md border-gray-300 shadow-sm p-2 border"><option>One day</option><option>2–3 days</option></select></div>
                        <div className="md:col-span-2"><label className="block text-sm font-medium text-gray-700 mb-1">Number of Travellers</label><input type="number" min="1" max="20" value={formData.travellers} onChange={e => update('travellers', parseInt(e.target.value) || 1)} className="block w-full rounded-md border-gray-300 shadow-sm p-2 border" /></div>
                    </div>
                    <button onClick={next} className="w-full mt-8 bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 font-semibold">Create trip outline →</button>
                </div>
            );
        }

        function Step2_Spots({ spots, selectedSpots, setSelectedSpots, next, prev }) {
            const toggle = (id) => setSelectedSpots(prev => prev.includes(id) ? prev.filter(s => s !== id) : [...prev, id]);
            const [weather, setWeather] = useState(null);
            useEffect(() => { if (spots.length > 0) safeFetch(`${API}/weather/${spots[0].id}`, {temp: 24, condition: "Partly Cloudy", rain_chance: "10%", wind: "12 km/h"}).then(setWeather); }, [spots]);
            return (
                <div className="bg-white p-8 rounded-xl shadow-sm border">
                    <div className="flex justify-between items-center mb-6"><h3 className="text-xl font-bold">Select Tourist Spots</h3>{weather && (<div className="flex items-center space-x-3 bg-blue-50 px-4 py-2 rounded-lg text-sm"><span className="text-2xl">⛅</span><div><div className="font-bold">{weather.temp}°C · {weather.condition}</div><div className="text-xs text-gray-500">Rain: {weather.rain_chance} · Wind: {weather.wind}</div></div></div>)}</div>
                    <div className="space-y-4">{spots.map(spot => (<div key={spot.id} onClick={() => toggle(spot.id)} className={`p-4 border rounded-lg cursor-pointer transition ${selectedSpots.includes(spot.id) ? 'border-indigo-500 bg-indigo-50' : 'border-gray-200 hover:border-gray-300'}`}><div className="flex justify-between items-center"><h4 className="font-bold text-lg">{spot.name}</h4><div className="flex items-center text-sm text-gray-600"><CrowdIndicator level={spot.crowd_level} /> {spot.crowd_level} Crowd</div></div><p className="text-sm text-gray-500 mt-1">{spot.aesthetic}</p><div className="mt-2 text-xs text-gray-400">Sentiment: {Math.round(spot.sentiment_score * 100)}% Positive • Entry: ₹{spot.entry_fee}</div></div>))}</div>
                    <div className="flex space-x-4 mt-8"><button onClick={prev} className="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg hover:bg-gray-300 font-semibold">← Back</button><button onClick={next} disabled={selectedSpots.length === 0} className="flex-1 bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 disabled:bg-gray-300 font-semibold">Next: Pick Driver →</button></div>
                </div>
            );
        }

        function Step3_Drivers({ drivers, selectedDriver, setSelectedDriver, next, prev }) {
            return (
                <div className="bg-white p-8 rounded-xl shadow-sm border">
                    <h3 className="text-xl font-bold mb-6">Choose Your Verified Driver</h3>
                    <div className="space-y-4">{drivers.map(driver => (<div key={driver.id} onClick={() => setSelectedDriver(driver)} className={`p-4 border rounded-lg cursor-pointer transition ${selectedDriver?.id === driver.id ? 'border-indigo-500 bg-indigo-50' : 'border-gray-200 hover:border-gray-300'}`}><div className="flex justify-between"><div><h4 className="font-bold flex items-center">{driver.name} {driver.background_verified && <span className="text-xs bg-blue-100 text-blue-800 px-2 py-0.5 rounded ml-2">Verified</span>}</h4><p className="text-sm text-gray-600">{driver.vehicle_type} • {driver.experience_years} yrs exp</p><p className="text-xs text-gray-500 mt-1">Languages: {driver.languages.join(", ")}</p></div><div className="text-right"><div className="text-yellow-500 font-bold">★ {driver.communication_rating}</div><div className="text-xs text-gray-500">Comm. Rating</div></div></div></div>))}</div>
                    <div className="flex space-x-4 mt-8"><button onClick={prev} className="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg hover:bg-gray-300 font-semibold">← Back</button><button onClick={next} disabled={!selectedDriver} className="flex-1 bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 disabled:bg-gray-300 font-semibold">Generate Itinerary & Quote →</button></div>
                </div>
            );
        }

        function Step4_Itinerary({ itinerary, restaurants, travellers, driverId }) {
            const [reviews, setReviews] = useState([]);
            useEffect(() => { if (driverId) safeFetch(`${API}/reviews/${driverId}`, [{"id":"rv1","text":"The driver was very punctual and the car was clean. Highly recommend!","rating":5,"authenticity_score":0.95,"is_fake":false},{"id":"rv2","text":"GOOD BEST AMAZING SUPERB BOOK NOW!!!","rating":5,"authenticity_score":0.3,"is_fake":true}]).then(setReviews); }, [driverId]);
            return (
                <div className="space-y-6 fade-in">
                    <div className="bg-white p-6 rounded-xl shadow-sm border"><h3 className="text-xl font-bold mb-4">Your Custom Itinerary</h3><ol className="list-decimal list-inside space-y-2 text-gray-700">{itinerary.route_plan.map((stop, i) => <li key={i} className={i === 0 || i === itinerary.route_plan.length - 1 ? 'font-semibold text-indigo-700' : ''}>{stop}</li>)}</ol></div>
                    <div className="bg-white p-6 rounded-xl shadow-sm border"><h3 className="text-xl font-bold mb-4">Price Breakdown</h3><div className="space-y-2 text-gray-700"><div className="flex justify-between"><span>Transport ({itinerary.driver_details.vehicle_type})</span><span>₹{itinerary.breakdown.transport_cost}</span></div><div className="flex justify-between"><span>Entry Fees ({travellers} pax)</span><span>₹{itinerary.breakdown.entry_fees}</span></div><div className="flex justify-between"><span>Service Charge</span><span>₹{itinerary.breakdown.service_charge}</span></div><hr className="my-2"/><div className="flex justify-between font-bold text-xl text-indigo-700"><span>Total Estimate</span><span>₹{itinerary.total_price}</span></div></div></div>
                    <div className="bg-white p-6 rounded-xl shadow-sm border"><h3 className="text-xl font-bold mb-4">AI-Verified Reviews for {itinerary.driver_details.name}</h3><div className="space-y-3">{reviews.map(r => (<div key={r.id} className={`p-3 rounded-lg border ${r.is_fake ? 'bg-red-50 border-red-200 opacity-60' : 'bg-white border-gray-200'}`}><div className="flex justify-between items-center mb-1"><div className="text-yellow-500 text-sm">{'★'.repeat(r.rating)}{'☆'.repeat(5-r.rating)}</div><AuthBadge score={r.authenticity_score} /></div><p className="text-sm text-gray-700 italic">"{r.text}"</p>{r.is_fake && <p className="text-xs text-red-600 mt-1 font-medium">⚠ Hidden: Flagged by AI as potentially fake/promotional.</p>}</div>))}</div></div>
                    <div className="bg-white p-6 rounded-xl shadow-sm border"><h3 className="text-xl font-bold mb-4">Recommended Restaurants</h3><div className="space-y-4">{restaurants.map(r => (<div key={r.id} className="border-b pb-3 last:border-0"><h4 className="font-bold">{r.name}</h4><p className="text-sm text-gray-600 mt-1">{r.cuisine} • ₹{r.avg_cost} avg • {r.distance_from_route}km from route</p><p className="text-xs text-gray-400">Open: {r.hours}</p></div>))}</div></div>
                    <button onClick={() => window.location.reload()} className="w-full bg-green-600 text-white py-4 rounded-xl hover:bg-green-700 font-bold text-lg shadow-lg">Confirm & Book This Trip</button>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
