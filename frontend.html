<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelMate | Plan your next journey</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-overlay {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .icon-box {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            min-width: 200px;
            z-index: 50;
        }

        .dropdown:hover .dropdown-menu {
            display: block;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const API = "http://localhost:8000/api";

        const safeFetch = async (url, fallback) => {
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error("HTTP error");
                return await res.json();
            } catch (error) {
                return fallback;
            }
        };

        const MOCK_SPOTS = [
            { "id": "s1", "name": "Tiger's Leap", "geography": "High altitude cliff", "history": "Named for tiger jumping", "aesthetic": "Stunning panoramic views", "sentiment_score": 0.85, "crowd_level": "High", "entry_fee": 20 },
            { "id": "s2", "name": "Bhushi Dam", "geography": "Water reservoir", "history": "Built in 1907", "aesthetic": "Water overflowing over steps", "sentiment_score": 0.70, "crowd_level": "High", "entry_fee": 0 },
            { "id": "s3", "name": "Karla Caves", "geography": "Basalt rock hills", "history": "Ancient Buddhist caves", "aesthetic": "Intricate carvings", "sentiment_score": 0.90, "crowd_level": "Low", "entry_fee": 250 }
        ];
        const MOCK_DRIVERS = [
            { "id": "d1", "name": "Ramesh Patil", "vehicle_type": "Sedan (Dzire)", "capacity": 4, "experience_years": 8, "languages": ["Marathi", "Hindi", "English"], "background_verified": true, "communication_rating": 4.8, "base_rate_per_km": 12.0 },
            { "id": "d2", "name": "Suresh Jadhav", "vehicle_type": "Innova Crysta", "capacity": 6, "experience_years": 12, "languages": ["Marathi", "Hindi"], "background_verified": true, "communication_rating": 4.5, "base_rate_per_km": 16.0 }
        ];
        const MOCK_RESTAURANTS = [
            { "id": "r1", "name": "Chhaya Restaurant", "cuisine": "Indian, Chinese", "avg_cost": 400, "distance_from_route": 0.5, "hours": "8:00 AM - 11:00 PM" },
            { "id": "r2", "name": "Maharashtra Dhaba", "cuisine": "Maharashtrian", "avg_cost": 250, "distance_from_route": 0.2, "hours": "6:00 AM - 11:00 PM" }
        ];
        const MOCK_PACKAGES = [
            { "id": "p1", "title": "Lonavala Express Day Trip", "provider": "MSRTC Shivneri", "price": 850, "inclusions": ["AC Bus", "Tiger's Leap", "Bhushi Dam"], "rating": 4.2, "duration": "One day", "preference": "Nature", "from": "Pune", "to": "Lonavala" },
            { "id": "p2", "title": "Premium Caves & Valleys Tour", "provider": "Deccan Odyssey Travels", "price": 2500, "inclusions": ["Innova Cab", "Karla Caves", "Lunch", "Guide"], "rating": 4.7, "duration": "Weekend", "preference": "Culture", "from": "Pune", "to": "Lonavala" },
            { "id": "p7", "title": "Heritage Caves Day Tour", "provider": "Heritage Walks", "price": 1800, "inclusions": ["AC Bus", "Karla & Bhaja Caves", "Guide", "Lunch"], "rating": 4.3, "duration": "One day", "preference": "Culture", "from": "Pune", "to": "Lonavala" },
            { "id": "p3", "title": "Budget Backpacker Special", "provider": "Youth Hostels India", "price": 600, "inclusions": ["Shared Cab", "Bhushi Dam", "Street Food Tour"], "rating": 4.0, "duration": "One day", "preference": "Food", "from": "Pune", "to": "Lonavala" },
            { "id": "p10", "title": "Mumbai Darshan Bus Ticket", "provider": "Mumbai Darshan Tours", "price": 499, "inclusions": ["12-hour guided tour", "Multilingual live guide", "Free cancellation", "Pickup & drop"], "rating": 4.6, "duration": "One day", "preference": "Culture", "from": "Mumbai", "to": "Mumbai (City Tour)", "itinerary": [{ "name": "The Asiatic Society Mumbai", "halt": "10 min" }, { "name": "Gateway of India", "halt": "45 min" }, { "name": "Sailing Boat Ride", "halt": "30 min" }, { "name": "Chhatrapati Shivaji Maharaj Vastu Sangrahalay", "halt": "50 min" }, { "name": "Jehangir Art Gallery", "halt": "15 min" }, { "name": "Paradox Museum", "halt": "1 hr" }, { "name": "Marine Drive", "halt": "10 min" }, { "name": "Mahalaxmi Temple", "halt": "35 min" }, { "name": "Nehru Science Centre", "halt": "50 min" }, { "name": "Siddhivinayak Temple", "halt": "35 min" }, { "name": "Bollywood Museum", "halt": "45 min" }, { "name": "Juhu Beach", "halt": "45 min" }], "boarding_points": [{ "route": "From Thane", "stops": "Thane, Mulund, Bhandup, Vikhroli, Ghatkopar, Chembur, CSTM" }, { "route": "From Panvel", "stops": "Panvel, Khanda Colony, Kalamboli, Kamothe, Kharghar, Belapur, Seawood, Nerul" }, { "route": "From Borivali", "stops": "Dahisar, Borivali, Kandivali, Malad, Goregaon, Jogeshwari, Andheri East, Bandra, Mahim, Dadar" }] }
        ];

        const CrowdIndicator = ({ level }) => {
            const colors = { Low: 'bg-green-500', Medium: 'bg-yellow-500', High: 'bg-red-500' };
            return <span className={`inline-block w-3 h-3 rounded-full ${colors[level]} mr-2`}></span>;
        };

        const AuthBadge = ({ score }) => {
            if (score >= 0.8) return <span className="text-xs bg-green-100 text-green-800 px-2 py-1 rounded-full font-medium">✓ Verified Authentic</span>;
            if (score >= 0.6) return <span className="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded-full font-medium">Likely Genuine</span>;
            return <span className="text-xs bg-red-100 text-red-800 px-2 py-1 rounded-full font-medium">⚠ Suspicious</span>;
        };

        function App() {
            const [view, setView] = useState('landing');
            const [modal, setModal] = useState(null);
            const [step, setStep] = useState(1);
            const [packageFlow, setPackageFlow] = useState({ active: false, stage: 'list', selectedPackage: null });
            const [formData, setFormData] = useState({ start_loc: 'Pune', dest: 'Lonavala', style: 'Nature & adventure', transport: 'Car / taxi', budget: 2000, duration: 'One day', travellers: 2 });
            const [spots, setSpots] = useState([]);
            const [drivers, setDrivers] = useState([]);
            const [restaurants, setRestaurants] = useState([]);
            const [packages, setPackages] = useState([]);
            const [selectedSpots, setSelectedSpots] = useState([]);
            const [selectedDriver, setSelectedDriver] = useState(null);
            const [itinerary, setItinerary] = useState(null);
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                Promise.all([
                    safeFetch(`${API}/spots`, MOCK_SPOTS),
                    safeFetch(`${API}/drivers`, MOCK_DRIVERS),
                    safeFetch(`${API}/restaurants`, MOCK_RESTAURANTS),
                    safeFetch(`${API}/packages`, MOCK_PACKAGES)
                ]).then(([s, d, r, p]) => {
                    setSpots(s); setDrivers(d); setRestaurants(r); setPackages(p);
                });
            }, []);

            const startWizard = () => { setView('wizard'); setStep(1); };
            const openPackageList = () => setPackageFlow({ active: true, stage: 'list', selectedPackage: null });
            const selectPackage = (pkg) => setPackageFlow({ active: true, stage: 'details', selectedPackage: pkg });
            const startPackageBooking = () => setPackageFlow({ ...packageFlow, stage: 'booking' });
            const confirmPackageBooking = () => setPackageFlow({ ...packageFlow, stage: 'success' });
            const closePackageFlow = () => setPackageFlow({ active: false, stage: 'list', selectedPackage: null });

            const calculateTrip = async () => {
                if (!selectedDriver) return alert("Please select a driver");
                setLoading(true);
                const payload = { spot_ids: selectedSpots, transport_mode: formData.transport.toLowerCase().includes('car') ? 'car' : 'bus', traveller_count: formData.travellers, driver_id: selectedDriver.id };
                try {
                    const res = await fetch(`${API}/itinerary/calculate`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
                    if (!res.ok) throw new Error("Backend error");
                    const data = await res.json();
                    setItinerary(data);
                } catch (e) {
                    const base_distance = 130 + (selectedSpots.length * 5);
                    const transport_cost = base_distance * selectedDriver.base_rate_per_km;
                    const entry_fees = spots.filter(s => selectedSpots.includes(s.id)).reduce((acc, s) => acc + s.entry_fee, 0) * formData.travellers;
                    setItinerary({ route_plan: ["Pune (Start)", ...spots.filter(s => selectedSpots.includes(s.id)).map(s => s.name), "Lonavala Market", "Pune (Drop)"], breakdown: { transport_cost, entry_fees, service_charge: 500 }, total_price: transport_cost + entry_fees + 500, driver_details: selectedDriver });
                }
                setLoading(false);
                setStep(4);
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-white shadow-sm z-20 relative">
                        <div className="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
                            <div className="flex items-center space-x-2 cursor-pointer" onClick={() => { setView('landing'); closePackageFlow(); }}>
                                <span className="text-2xl">↗</span>
                                <h1 className="text-xl font-bold text-indigo-700">TravelMate</h1>
                            </div>
                            <nav className="space-x-6 text-gray-600 font-medium flex items-center">
                                <div className="dropdown relative">
                                    <button className="hover:text-indigo-600 flex items-center">
                                        Explore
                                        <svg className="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>
                                    </button>
                                    <div className="dropdown-menu mt-2 py-2">
                                        <a href="#" className="block px-4 py-2 hover:bg-gray-100">🗺️ Popular Destinations</a>
                                        <a href="#" className="block px-4 py-2 hover:bg-gray-100">💡 Travel Tips & Guides</a>
                                        <a href="#" className="block px-4 py-2 hover:bg-gray-100">🔥 Special Offers</a>
                                    </div>
                                </div>
{(view === 'wizard' || packageFlow.active) && (                                    <button onClick={() => { setView('landing'); closePackageFlow(); }} className="text-indigo-600 hover:text-indigo-800">← Back to Home</button>
                                )}
                            </nav>
                        </div>
                    </header>

                    <main className="flex-grow">
                        {view === 'landing' && !packageFlow.active && <LandingView openPackageList={openPackageList} startWizard={startWizard} openChat={() => setView('chat')} />}
                        {packageFlow.active && <PackageBookingFlow stage={packageFlow.stage} selectedPackage={packageFlow.selectedPackage} packages={packages} onSelectPackage={selectPackage} onStartBooking={startPackageBooking} onConfirm={confirmPackageBooking} onClose={closePackageFlow} />}
                        {view === 'wizard' && !packageFlow.active && <WizardView step={step} setStep={setStep} formData={formData} setFormData={setFormData} spots={spots} drivers={drivers} restaurants={restaurants} selectedSpots={selectedSpots} setSelectedSpots={setSelectedSpots} selectedDriver={selectedDriver} setSelectedDriver={setSelectedDriver} itinerary={itinerary} calculateTrip={calculateTrip} loading={loading} start_loc={formData.start_loc} dest={formData.dest} />}
                    </main>

   {modal === 'ai' && <AIModal close={() => setModal(null)} />}
                    <footer className="bg-white border-t mt-auto">
                        <div className="max-w-6xl mx-auto px-4 py-6 text-center text-gray-500 text-sm">TravelMate · Travel more, spend wisely.</div>
                    </footer>
                </div>
            );
        }

        function LandingView({ openPackageList, startWizard, setModal }) {
            return (
                <div className="max-w-6xl mx-auto px-4 py-12 fade-in">
                    <div className="text-center mb-12">
                        <h2 className="text-4xl font-bold text-gray-900 mb-3">How would you like to travel?</h2>
                        <p className="text-lg text-gray-600">Choose your way to plan. We'll help you make the most of every journey.</p>
                    </div>
                    <div className="grid md:grid-cols-3 gap-8">
                        <div className="bg-white p-8 rounded-xl shadow-sm border border-gray-100 hover:shadow-lg hover:-translate-y-1 transition-all duration-300 cursor-pointer group" onClick={openPackageList}>
                            <div className="icon-box bg-gradient-to-br from-blue-400 to-blue-600 text-white mb-5 group-hover:scale-110 transition-transform">🧳</div>
                            <h3 className="text-xl font-bold mb-2">See Packages</h3>
                            <p className="text-gray-600 mb-4">Explore affordable trips and compare ready-made packages from travel agencies.</p>
                            <span className="text-indigo-600 font-semibold group-hover:underline">Explore packages →</span>
                        </div>
                        <div className="bg-white p-8 rounded-xl shadow-sm border border-gray-100 hover:shadow-lg hover:-translate-y-1 transition-all duration-300 cursor-pointer group" onClick={() => setModal('ai')}>
                            <div className="icon-box bg-gradient-to-br from-purple-400 to-purple-600 text-white mb-5 group-hover:scale-110 transition-transform">🤖</div>
                            <h3 className="text-xl font-bold mb-2">AI Travel Assistant</h3>
                            <p className="text-gray-600 mb-4">Tell us your destination, budget and interests. Get trip suggestions that fit you.</p>
                            <span className="text-indigo-600 font-semibold group-hover:underline">Plan with AI →</span>
                        </div>
                        <div className="bg-white p-8 rounded-xl shadow-sm border border-gray-100 hover:shadow-lg hover:-translate-y-1 transition-all duration-300 cursor-pointer group" onClick={startWizard}>
                            <div className="icon-box bg-gradient-to-br from-green-400 to-green-600 text-white mb-5 group-hover:scale-110 transition-transform">✏️</div>
                            <h3 className="text-xl font-bold mb-2">Customize Your Trip</h3>
                            <p className="text-gray-600 mb-4">Build your own adventure by choosing your destination, transport and activities.</p>
                            <span className="text-indigo-600 font-semibold group-hover:underline">Create your trip →</span>
                        </div>
                    </div>
                </div>
            );
        }

        function PackageBookingFlow({ stage, selectedPackage, packages, onSelectPackage, onStartBooking, onConfirm, onClose }) {
            const CITIES = ['Pune', 'Mumbai', 'Lonavala', 'Khandala', 'Mahabaleshwar', 'Nashik', 'Igatpuri', 'Mumbai (City Tour)'];
            const [from, setFrom] = useState('Any');
            const [to, setTo] = useState('Any');
            const [adults, setAdults] = useState(2);
            const [kids, setKids] = useState(0);
            const [departDate, setDepartDate] = useState('');
            const [duration, setDuration] = useState('Any');
            const [preference, setPreference] = useState('Any');
            const [budget, setBudget] = useState(10000);
            const [filteredPackages, setFilteredPackages] = useState(packages);
            const [hasSearched, setHasSearched] = useState(false);
            const [boardingPoint, setBoardingPoint] = useState('');
            const [travelDate, setTravelDate] = useState('');
            const [passengerName, setPassengerName] = useState('');
            const [passengerPhone, setPassengerPhone] = useState('');
            const [seats, setSeats] = useState(1);

            useEffect(() => { setFilteredPackages(packages); }, [packages]);

            const fromOptions = ['Any', ...CITIES.filter(city => city !== to)];
            const toOptions = ['Any', ...CITIES.filter(city => city !== from)];

            const handleSearch = () => {
                setHasSearched(true);
                const results = packages.filter(p => {
                    if (p.price > budget) return false;
                    if (from !== 'Any' && p.from && p.from.toLowerCase() !== from.toLowerCase()) return false;
                    if (to !== 'Any' && p.to && p.to.toLowerCase() !== to.toLowerCase()) return false;
                    if (duration !== 'Any' && p.duration !== duration) return false;
                    if (preference !== 'Any' && p.preference !== preference) return false;
                    return true;
                });
                setFilteredPackages(results);
            };

            const handleReset = () => {
                setFrom('Any'); setTo('Any'); setBudget(10000); setDuration('Any'); setPreference('Any');
                setFilteredPackages(packages); setHasSearched(false);
            };

            const groupedPackages = filteredPackages.reduce((acc, pkg) => {
                const route = `${pkg.from} → ${pkg.to}`;
                if (!acc[route]) acc[route] = [];
                acc[route].push(pkg);
                return acc;
            }, {});

                        if (stage === 'list') {
                return (
                    <div className="max-w-5xl mx-auto px-4 py-8 fade-in">
                        <h2 className="text-3xl font-bold text-gray-900 mb-6">Explore Travel Packages</h2>

                        {/* FILTER BAR - 4 + 4 GRID */}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-8">
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                                <div>
                                    <label className="text-sm font-medium text-gray-700 mb-1 block">Where from?</label>
                                    <select value={from} onChange={e => setFrom(e.target.value)} className="block w-full rounded-md border-gray-300 shadow-sm p-2 border bg-white">
                                        {fromOptions.map(c => <option key={c}>{c}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="text-sm font-medium text-gray-700 mb-1 block">Where to?</label>
                                    <select value={to} onChange={e => setTo(e.target.value)} className="block w-full rounded-md border-gray-300 shadow-sm p-2 border bg-white">
                                        {toOptions.map(c => <option key={c}>{c}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="text-sm font-medium text-gray-700 mb-1 block">Duration</label>
                                    <select value={duration} onChange={e => setDuration(e.target.value)} className="block w-full rounded-md border-gray-300 shadow-sm p-2 border bg-white">
                                        <option>Any</option><option>One day</option><option>Weekend</option><option>2-3 days</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="text-sm font-medium text-gray-700 mb-1 block">Preference</label>
                                    <select value={preference} onChange={e => setPreference(e.target.value)} className="block w-full rounded-md border-gray-300 shadow-sm p-2 border bg-white">
                                        <option>Any</option><option>Nature</option><option>Culture</option><option>Food</option><option>Relaxation</option>
                                    </select>
                                </div>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                                <div>
                                    <label className="text-sm font-medium text-gray-700 mb-1 block">Adults</label>
                                    <input type="number" min="1" value={adults} onChange={e => setAdults(e.target.value)} className="block w-full rounded-md border-gray-300 shadow-sm p-2 border" />
                                </div>
                                <div>
                                    <label className="text-sm font-medium text-gray-700 mb-1 block">Kids</label>
                                    <input type="number" min="0" value={kids} onChange={e => setKids(e.target.value)} className="block w-full rounded-md border-gray-300 shadow-sm p-2 border" />
                                </div>
                                <div>
                                    <label className="text-sm font-medium text-gray-700 mb-1 block">Departure Date</label>
                                    <input type="date" value={departDate} onChange={e => setDepartDate(e.target.value)} className="block w-full rounded-md border-gray-300 shadow-sm p-2 border" />
                                </div>
                                <div>
                                    <label className="text-sm font-medium text-gray-700 mb-1 block">Max Budget (₹)</label>
                                    <input type="number" value={budget} onChange={e => setBudget(parseInt(e.target.value) || 0)} className="block w-full rounded-md border-gray-300 shadow-sm p-2 border" />
                                </div>
                            </div>
                            <div className="flex space-x-3">
                                <button onClick={handleSearch} className="flex-1 bg-indigo-600 text-white py-2.5 rounded-lg hover:bg-indigo-700 font-semibold transition flex items-center justify-center">
                                    <span className="w-2 h-2 bg-teal-300 rounded-full mr-2 inline-block"></span> Search Packages
                                </button>
                                <button onClick={handleReset} className="px-6 bg-gray-200 text-gray-700 py-2.5 rounded-lg hover:bg-gray-300 font-medium transition">Reset</button>
                            </div>
                        </div>

                        {/* COUNT HEADING */}
                        <h3 className="text-xl font-bold text-gray-900 mb-4">
                            {hasSearched ? `Found ${filteredPackages.length} package(s)` : `All Packages (${filteredPackages.length})`}
                        </h3>

                        {/* FLAT HORIZONTAL PACKAGE CARDS */}
                        {filteredPackages.length === 0 ? (
                            <div className="text-center py-20 bg-white rounded-xl border">
                                <div className="text-4xl mb-2">🔍</div>
                                <p className="text-gray-600 font-medium">No packages match your filters.</p>
                                <button onClick={handleReset} className="mt-4 text-indigo-600 hover:underline text-sm">Clear all filters</button>
                            </div>
                        ) : (
                            <div className="space-y-6">
                                {filteredPackages.map(p => (
                                    <div key={p.id} className="bg-white border border-gray-200 rounded-xl p-6 hover:shadow-md transition">
                                        <div className="flex justify-between items-start">
                                            <h4 className="text-2xl font-bold text-gray-900">{p.title}</h4>
                                            <div className="text-yellow-500 font-bold text-lg">★ {p.rating}</div>
                                        </div>
                                        <p className="text-gray-600 mt-1">By {p.provider} · <span className="text-indigo-600">{p.from} → {p.to}</span></p>
                                        <p className="text-sm text-gray-500 mt-3">Includes: {p.inclusions.join(", ")}</p>
                                        <div className="flex gap-2 mt-3">
                                            <span className="text-xs bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-medium">{p.duration}</span>
                                            <span className="text-xs bg-green-100 text-green-700 px-3 py-1 rounded-full font-medium">{p.preference}</span>
                                        </div>
                                        <div className="mt-5 pt-4 border-t border-gray-200 flex justify-between items-center">
                                            <div>
                                                <span className="text-3xl font-bold text-indigo-700">₹{p.price}</span>
                                                <span className="text-sm text-gray-500">/person</span>
                                            </div>
                                            <button onClick={() => onSelectPackage(p)} className="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 font-semibold transition shadow-sm">
                                                View Details →
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                );
            }

            if (stage === 'details' && selectedPackage) {
                return (
                    <div className="max-w-5xl mx-auto px-4 py-8 fade-in bg-gray-50 min-h-screen">
                        <button onClick={onClose} className="text-indigo-600 mb-4 hover:underline font-medium flex items-center text-sm">← Back to all packages</button>
                        <div className="relative h-64 rounded-xl overflow-hidden mb-8 shadow-lg">

                                        <AuthBadge score={r.authenticity_score} />
                                    </div>
                                    <p className="text-sm text-gray-700 italic">"{r.text}"</p>
                                    {r.is_fake && <p className="text-xs text-red-600 mt-1 font-medium">⚠ Hidden: Flagged by AI as potentially fake/promotional.</p>}
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="bg-white p-6 rounded-xl shadow-sm border">
                        <h3 className="text-xl font-bold mb-4">Recommended Restaurants</h3>
                        <div className="space-y-4">
                            {restaurants.map(r => (
                                <div key={r.id} className="border-b pb-3 last:border-0">
                                    <h4 className="font-bold">{r.name}</h4>
                                    <p className="text-sm text-gray-600 mt-1">{r.cuisine} • ₹{r.avg_cost} avg • {r.distance_from_route}km from route</p>
                                    <p className="text-xs text-gray-400">Open: {r.hours}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                    <button onClick={() => window.location.reload()} className="w-full bg-green-600 text-white py-4 rounded-xl hover:bg-green-700 font-bold text-lg shadow-lg">Confirm & Book This Trip</button>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
